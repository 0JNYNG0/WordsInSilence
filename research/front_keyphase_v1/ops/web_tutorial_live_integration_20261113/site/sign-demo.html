<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>원본과 캐릭터 · 수어 시범</title><link rel="icon" href="data:,"><link rel="stylesheet" href="sign-demo.css"></head>

<header><div><p class="eyebrow">동작을 보고 따라 해요</p><h1 id="title">시범 불러오는 중</h1></div><nav aria-label="시범 단어"><a href="?word=WORD0099">사과</a><a href="?word=WORD1290">감사</a></nav></header>
